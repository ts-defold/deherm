name: derivation

# Does this repository derive the same thing on every machine?
#
# The derivation chain starts at `scripts/import-defold-sdk.py` and ends at a
# policy root that clients resolve by Defold revision. Everything in between is
# a pure function of the pinned revision, the reviewed overrides, and the
# generators - or it is supposed to be. It was not: the parse used the host
# `clang++` with no target and the host's libc, so Ubuntu and macOS disagreed
# about 79 of the 121 public dmSDK headers, and `policy-revisions.yml` was
# pinned to `macos-15` to keep the disagreement out of sight.
#
# See `.agents/docs/decisions/target-directed-dmsdk-parse.md`. This workflow is
# the measurement that decision rests on, and it is deliberately not a new kind
# of evidence: every step below is a `--check` the repository already runs. A
# `--check` regenerates the artifact and compares it byte for byte with the
# committed one, so the committed artifacts ARE the fixture. Linux authors the
# policy; macOS and Windows reporting "current" means both reproduced those
# bytes, including the policy root. A host that cannot reproduce them fails
# here, with the list of files that moved, rather than quietly publishing a
# second root nobody compares.

on:
  push:
    paths:
      - upstream.lock
      - scripts/import-defold-sdk.py
      - scripts/generate-dmsdk-sdk.mjs
      - scripts/generate-dmsdk-target-conditionals.mjs
      - scripts/generate-api-policy.mjs
      - scripts/derive-revision.mjs
      - packages/bindings/overrides/dmsdk-target-macros.json
      - packages/compiler/src/api-policy.mjs
      - packages/compiler/src/preprocessor-conditions.mjs
      - .github/workflows/derivation.yml
  pull_request:
    paths:
      - upstream.lock
      - scripts/import-defold-sdk.py
      - scripts/generate-dmsdk-sdk.mjs
      - scripts/generate-dmsdk-target-conditionals.mjs
      - scripts/generate-api-policy.mjs
      - scripts/derive-revision.mjs
      - packages/bindings/overrides/dmsdk-target-macros.json
      - packages/compiler/src/api-policy.mjs
      - packages/compiler/src/preprocessor-conditions.mjs
      - .github/workflows/derivation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derivation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-parity:
    name: ${{ matrix.role }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the sole producer: policy-revisions.yml derives and publishes
        # there. macOS and Windows are isolated parity witnesses. They reproduce
        # the committed Linux artifacts byte for byte but never author or
        # publish policy bytes, so their longer queues do not move authority to
        # a scarce runner.
        include:
          - os: ubuntu-24.04
            role: derive canonical policy
            python: python3
          - os: macos-15
            role: validate Linux policy
            python: python3
          - os: windows-2025
            role: validate Linux policy
            python: python
    defaults:
      run:
        # GitHub's Windows image ships Git Bash. The derivation commands and
        # bootstrapper are intentionally the same on all three hosts; a separate
        # PowerShell implementation would be a second pipeline, not parity.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record the compiler this host derives with
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.role }} — ${{ matrix.os }}"
            echo
            echo '```'
            clang++ --version
            ${{ matrix.python }} --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The pinned parse sysroot. Keyed by the digest `upstream.lock` pins, so a
      # repin misses the cache rather than serving the wrong bytes - and the
      # importer verifies the digest whether it downloaded or found them.
      - id: sysroot
        shell: bash
        run: sed -n 's/^DMSDK_PARSE_SYSROOT_SHA256=/digest=/p' upstream.lock >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: upstream/dmsdk-parse-sysroot
          key: dmsdk-parse-sysroot-${{ steps.sysroot.outputs.digest }}

      - name: Fetch the pinned Defold sources
        # This lane derives dmSDK only. The importer fetches and digest-checks
        # its cached sysroot itself; avoiding bootstrap's python3 spelling and
        # the unrelated ref-doc archive keeps the same path valid on Windows.
        run: ./scripts/bootstrap-upstreams.sh defold

      # Parse, lower, resolve per target, assemble the policy. Each step refuses
      # to differ from what is committed, so the last one passing is the
      # statement that all three hosts computed the same Linux-authored policy
      # root.
      - name: The declaration inventory is host-independent
        run: ${{ matrix.python }} scripts/import-defold-sdk.py --check
      - name: The dmSDK IR derived from it is host-independent
        run: node scripts/generate-dmsdk-sdk.mjs --check
      - name: The per-target conditional census is host-independent
        run: node scripts/generate-dmsdk-target-conditionals.mjs --check
      - name: The declaration accounting is host-independent
        run: node scripts/generate-dmsdk-accounting.mjs --check
      - name: The policy root is host-independent
        run: node scripts/generate-api-policy.mjs --check

      - name: Name the policy root this host derived
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          revision="$(sed -n 's/^DEFOLD_REV=//p' upstream.lock)"
          root="$(node -e '
            const entry = require(`./packages/bindings/generated/policy/v1/index/${process.argv[1]}.json`);
            process.stdout.write(entry.policyRoot);
          ' "$revision")"
          echo "${{ matrix.role }} on ${{ matrix.os }} resolves Defold \`$revision\` to policy root \`$root\`." >> "$GITHUB_STEP_SUMMARY"
