name: end-to-end

# Can a user take what we publish and build a game with it?
#
# Every other check in this repository verifies one stage against its own
# inputs. This one runs `scripts/check-end-to-end.mjs`, which runs the stages in
# the order a user meets them - resolve a published policy, download the
# published host tools, download the published per-target Hermes archives,
# scaffold a project, generate and type check it, and have Bob build it for
# every Defold bundle target we publish.
#
# ── Why the matrix is one job per target ────────────────────────────────────
#
# The `bob` stage is the only slow one and it is embarrassingly parallel: each
# target is an independent upload to Extender. Splitting it means one failing
# target is named in the job list rather than buried in a log, and `fail-fast:
# false` keeps the other twelve running so a run reports the whole matrix.
#
# ── Why this is not on every push ───────────────────────────────────────────
#
# The build server is Defold's, not ours. A per-push matrix would send eleven
# native builds to a service another project pays for, several times a day, for
# changes that cannot affect them. Nightly plus `workflow_dispatch` keeps the
# signal and the courtesy. The cheap half - the ledger, the policy resolution,
# the scaffold, the generator - runs on every push, because that half costs
# nobody anything and catches most of what breaks.
#
# A toolchain fingerprint change is deliberately absent from the push paths.
# `native-artifacts.yml` dispatches this workflow only after every immutable row
# for the new fingerprints is published; running concurrently would test a
# release that cannot exist yet and turn the expected publication window into a
# red end-to-end result.

on:
  schedule:
    # After the unified `policy` workflow's discovery window, so its accumulated
    # website catalogue can be current before this consumer proof resolves it.
    - cron: '43 6 * * *'
  push:
    paths:
      - packages/cli/src/scaffold.mjs
      - packages/cli/src/toolchains.mjs
      - packages/toolchains/defold-platform-pairs.json
      - packages/toolchains/package.json
      - scripts/check-end-to-end.mjs
      - scripts/bob.sh
      - scripts/generate-defold-bundle-targets.mjs
      - scripts/resolve-defold-platform.mjs
      - tests/end-to-end-gate.test.mjs
      - tests/package-smoke.test.mjs
      - tests/toolchain-matrix.test.mjs
      - .github/workflows/end-to-end.yml
  workflow_dispatch:
    inputs:
      build-server:
        description: Defold build service override; blank selects production for stable and staging otherwise
        required: false

permissions:
  contents: read

concurrency:
  # A cheap push proof and a full artifact-dispatched/Bob proof are different
  # lanes. A follow-up push may replace an older cheap run, but it must never
  # cancel the full matrix that native-artifacts started after publication.
  group: end-to-end-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: true

jobs:
  # Everything that needs no build server and no JDK. This is the half that runs
  # on a push: if the ledger, the published policy, the published tools or the
  # generator are broken, nothing downstream can be right.
  local:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The ledger first, and on its own. A target Defold added and nothing here
      # builds for must fail before any stage runs, because the run would
      # otherwise report a clean matrix over an incomplete one.
      - name: Every declared bundle target is exercised or declined by name
        run: node --test tests/end-to-end-gate.test.mjs

      - id: plan
        run: |
          set -euo pipefail
          node scripts/check-end-to-end.mjs --plan --json > plan.json
          node -e '
            const plan = require("./plan.json");
            const exercised = plan.targets.filter((row) => row.disposition === "exercise").map((row) => row.target);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `targets=${JSON.stringify(exercised)}\n`);
          ' >> "$GITHUB_OUTPUT"
          node scripts/check-end-to-end.mjs --plan >> "$GITHUB_STEP_SUMMARY"

      # A push may be the same push that rotates a content-addressed host-tool
      # fingerprint. native-artifacts publishes those immutable rows in a
      # separate workflow and dispatches this workflow again only after every
      # row exists. The cheap push proof must not race that publication and
      # report the expected window as a product failure. When both current
      # linux-x64 assets already exist we still exercise them immediately; when
      # either is absent we defer only that stage to the ordered dispatch.
      - id: published-host-tools
        name: Determine whether this push can exercise published host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != push ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          available=true
          while IFS=$'\t' read -r family tag asset; do
            if ! gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              available=false
              echo "::notice::$family asset $asset in $tag is still publishing; the ordered artifact dispatch will exercise it"
            fi
          done < <(node -e '
            const tags = require("./packages/toolchains/release-tags.json").families;
            for (const family of ["hermes-host", "dehermc"])
              console.log(`${family}\t${tags[family].tag}\t${tags[family].assets["linux-x64"]}`);
          ')
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = false ]; then
            echo "Host-tool consumer proof deferred until native-artifacts publishes the current fingerprint and dispatches this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      # This is deliberately a clean, online cache. Unlike the pre-publication
      # smoke in native-artifacts.yml, no compiler path is supplied: the packed
      # CLI must resolve, download, extract, authenticate, cache and execute the
      # release exactly as a customer install does.
      - name: Packed clean consumer downloads the published compiler
        if: github.event_name != 'push'
        run: |
          bash scripts/bootstrap-upstreams.sh hermes
          DEHERM_PACKAGE_SMOKE_DOWNLOAD_DEHERMC=1 \
            node --test --test-name-pattern "packed npm artifact" tests/package-smoke.test.mjs

      - name: Policy, published tools, scaffold and generate
        run: |
          stages=(
            --stage policy
            --stage scaffold
            --stage generate
          )
          if [ "${{ github.event_name }}" != push ] || [ "${{ steps.published-host-tools.outputs.available }}" = true ]; then
            stages+=(--stage host-tools)
          fi
          # A push is the cheap consumer half. A new native fingerprint may be
          # publishing concurrently, so only the artifact-dispatched/manual/
          # scheduled run may require the target archive and launch Bob.
          if [ "${{ github.event_name }}" != push ]; then
            stages+=(--stage target-archives)
          fi
          node scripts/check-end-to-end.mjs "${stages[@]}"

  # The npm package's prepack contract stages the public Hermes and JSI headers
  # from the pinned Hermes revision. They are deliberately not committed: the
  # package, not the Git checkout, is the distributable extension. The Bob
  # matrix operates from a checkout, so materialize that same package input
  # once and share it with every target instead of cloning Hermes ten times.
  extension-headers:
    needs: local
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - run: node scripts/stage-hermes-public-headers.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: pinned-hermes-public-headers
          path: |
            defold/defold_hermes/include/hermes
            defold/defold_hermes/include/jsi
          if-no-files-found: error
          retention-days: 7

  # One target, one job. Extender compiles the generated bindings and the whole
  # extension with that target's real toolchain, so a green job here is the
  # statement that what we generate compiles for that target AND that Bob can
  # build the game with it. There is no separate "does it compile" check,
  # because a separate one would compile with something other than what ships.
  bob:
    needs: [local, extension-headers]
    if: github.event_name != 'push'
    name: bob ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.local.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ./scripts/bootstrap-bob.sh
      - uses: actions/download-artifact@v7
        with:
          name: pinned-hermes-public-headers
          path: defold/defold_hermes/include

      - name: Build for ${{ matrix.target }}
        env:
          DEFOLD_HERMES_BUILD_SERVER: ${{ inputs.build-server }}
        run: |
          node scripts/check-end-to-end.mjs \
            --target "${{ matrix.target }}" \
            --stage policy --stage target-archives --stage scaffold --stage generate --stage bob

      - name: Print Extender failure log
        if: failure()
        run: |
          log="build/end-to-end/project/build/${{ matrix.target }}/log.txt"
          if [ -f "$log" ]; then
            echo "===== $log ====="
            cat "$log"
          else
            echo "Bob did not leave an Extender log at $log" >&2
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bob-extender-log-${{ matrix.target }}
          path: build/end-to-end/project/build/${{ matrix.target }}/log.txt
          if-no-files-found: ignore
