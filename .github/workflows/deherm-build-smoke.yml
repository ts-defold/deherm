name: déherm consumer build smoke

# Dogfood the public workflow from a clean checkout when the consumer-build
# seam changes. Manual dispatch also allows the local Extender mode.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deherm-build.yml
      - .github/workflows/deherm-build-smoke.yml
      - action.yml
      - github-action/**
      - packages/cli/src/ci-bundle.mjs
      - packages/cli/src/cli.mjs
      - packages/cli/src/dev/defold-builder.mjs
      - scripts/stage-hermes-public-headers.mjs
      - scripts/bootstrap-upstreams.sh
      - package.json
  workflow_dispatch:
    inputs:
      mode:
        description: Extender location
        type: choice
        options:
          - defold
          - local
        default: defold
      targets:
        description: JSON array of War Battles bundle targets
        type: string
        default: '["wasm-web","x86_64-linux"]'

permissions:
  contents: read

jobs:
  war-battles:
    uses: ./.github/workflows/deherm-build.yml
    with:
      action-ref: ${{ github.sha }}
      # This revision has a digest-verified Bob mirror. War Battles' checked-in
      # engine fixture stays pinned separately for its native evidence tests.
      defold-sdk: 4019b8f249383f281c03463fca74b13afe4828b1
      mode: ${{ inputs.mode || 'defold' }}
      targets: ${{ inputs.targets || '["wasm-web","x86_64-linux"]' }}
      project: examples/war-battles-online/defold
      entry: main/player.script.ts
    secrets: inherit
