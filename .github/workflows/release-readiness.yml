name: release-readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:release-preflight

  package-candidate:
    name: Clean npm candidate (no hosted Bob)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - run: node scripts/prove-npm-consumer.mjs --pack-only
      - name: Prove the retained archive from an isolated install
        run: |
          archive="$(node -p 'require("./build/npm-consumer-proof.json").tarball')"
          node scripts/prove-npm-consumer.mjs --candidate "$archive" --prepare-only
      - uses: actions/upload-artifact@v6
        with:
          name: npm-premerge-candidate
          path: |
            build/npm-consumer-proof.json
            build/npm-release-candidate/*.tgz
          if-no-files-found: error

  portable-tooling:
    name: TUI, VS Code, and release contract (${{ matrix.os }})
    needs: preflight
    env:
      # Product downloads remain usable without GitHub auth, but the matrix
      # intentionally exercises several release-integrity lookups in parallel.
      # Authenticate those lookups so CI cannot exhaust the public API quota.
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The TUI owns a native PTY dependency. Let pnpm install its verified
      # platform prebuild so this matrix exercises the package users receive.
      - run: pnpm install --frozen-lockfile
      - name: Host compiler pin fixtures (offline)
        run: node --test tests/host-compiler-release-pins.test.mjs
      - name: Verify host compiler pins against published releases
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: pnpm check:host-compiler-release-pins
      - run: pnpm check:release-readiness
      # The real compiler fixtures import the revision-selected project SDK.
      # Generate it from the same published policy a clean consumer uses;
      # never let an ignored contributor .deherm tree satisfy this lane.
      - name: Generate clean project SDK
        env:
          DEHERM_WEBTRANSPORT_ARTIFACT_TARGET: web
        run: node bin/deherm.mjs generate --project examples/war-battles-online/defold --force
      - name: Preflight locked Static Hermes application sources
        if: runner.os == 'Linux'
        run: node --test --test-name-pattern 'project lock application sources match' tests/war-battles-static-hermes-build-gate.test.mjs
      - name: Cache aggregate upstream inputs
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: upstream
          key: release-readiness-upstreams-${{ runner.os }}-${{ hashFiles('upstream.lock') }}
      - name: Install aggregate native headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgl-dev
      - name: Bootstrap aggregate upstream inputs
        if: runner.os == 'Linux'
        run: ./scripts/bootstrap-upstreams.sh
      - name: Compile native component ABI fixture before aggregate tests
        if: runner.os == 'Linux'
        run: pnpm check:release-preflight --native
      - name: Regress stale native ABI at the preflight boundary
        if: runner.os == 'Linux'
        run: node --test tests/release-preflight.test.mjs
      - name: Aggregate test gate
        if: runner.os == 'Linux'
        run: node scripts/run-release-command.mjs pnpm test
      - name: Portable development tooling
        if: runner.os != 'Linux'
        run: node scripts/run-release-command.mjs pnpm test:dev
      - run: node scripts/run-release-command.mjs pnpm test:vscode
      - run: node scripts/run-release-command.mjs deno task --config examples/defold-webtransport-minimal/deno.json check
      - if: runner.os != 'Linux'
        run: node scripts/run-release-command.mjs node --test tests/defold-webtransport-package.test.mjs tests/defold-webtransport-minimal-example.test.mjs tests/defold-webtransport-public-api.test.mjs
      - if: runner.os != 'Linux'
        run: node scripts/run-release-command.mjs node native/webtransport-cpp/test/browser_backend_test.mjs
