name: commit-provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify human authorship and signatures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-commit-provenance.mjs HEAD
