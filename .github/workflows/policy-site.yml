name: policy-site

# Publish the content-addressed API policy store as a static site.
#
# See `.agents/docs/decisions/layered-api-policy-cache.md`. The site serves one
# owned prefix and nothing at a root-level segment:
#
#   <base>/v1/index/<defold-sha>.json    -> { policyRoot, generator }
#   <base>/v1/policy/<root-hash>.json    -> names its subtrees
#   <base>/v1/object/<subtree-hash>.json -> one namespace's surface
#
# ── What this job does and does not rebuild ─────────────────────────────────
#
# It derives NOTHING. The policy store is committed under
# packages/bindings/generated/policy, so this job reads bytes that were reviewed
# in the pull request that produced them and emits the tree around them. That is
# what makes "the site builds from a clean checkout" true: no Defold checkout, no
# clang, no network.
#
# Re-running is therefore free and idempotent in the sense that matters: an
# object's URL never changes its bytes, and an object already published is
# emitted byte-identically rather than re-derived. `build-policy-site.mjs`
# reports how many files it actually had to write; in the steady state that is
# zero. Pages itself replaces the whole site artifact on each deploy - it has no
# incremental upload - so the guarantee is immutability of each object, not a
# partial upload.
#
# ── Trust ───────────────────────────────────────────────────────────────────
#
# Objects are self-verifying: a consumer hashes the body and compares it to the
# hash in the path, so a hostile or corrupted mirror cannot substitute content.
# Only the index is a mutable mapping, which is why it also ships inside the npm
# package and why the release's copy wins over a fetched one.

on:
  push:
    branches: [main]
    paths:
      - packages/bindings/generated/policy/**
      - packages/bindings/generated/defold-policy-index.json
      - packages/bindings/generated/defold-api-policy.json
      - packages/bindings/policy-site.json
      - scripts/build-policy-site.mjs
      - scripts/generate-api-policy.mjs
      - scripts/check-policy-site-resolution.mjs
      - packages/compiler/src/api-policy.mjs
      - .github/workflows/policy-site.yml
  workflow_dispatch:

# Publishing is a push to the branch Pages serves, not an Actions deployment,
# so this needs to write contents and nothing else. See
# .agents/docs/decisions/layered-api-policy-cache.md: actions/deploy-pages
# replaces the whole site per deploy, which would make an append-only store
# re-upload its entire history every night.
permissions:
  contents: write
  # Requesting a Pages build explicitly, rather than relying on the push to
  # trigger one. See the publish step for why.
  pages: write

# Two runs must not push the branch concurrently. Queueing rather than
# cancelling means a push that lands mid-run still publishes, which matters
# because the store is additive and each run may carry objects no other run has.
concurrency:
  group: policy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The store must be internally consistent before any of it is served: every
      # object an index entry reaches has to exist and hash to its own path, and
      # nothing unreferenced may sit in the store. A `--check` failure here means
      # the committed store and the committed index disagree, which is exactly
      # the state that must never be published.
      - name: Verify the committed policy store
        run: node scripts/generate-api-policy.mjs --check

      - name: Emit the site
        run: node scripts/build-policy-site.mjs --out build/policy-site

      # Resolve sha -> index -> policy -> objects over HTTP against a served copy
      # of what is about to be deployed, including the negative control that a
      # tampered object is rejected. A deploy that has not been resolved end to
      # end is a deploy nobody has checked.
      - name: Resolve the emitted tree end to end
        run: node scripts/check-policy-site-resolution.mjs

      - name: Report what is being published
        run: |
          {
            echo "### Policy site"
            echo
            echo '```'
            node -e '
              const index = require("./packages/bindings/generated/defold-policy-index.json");
              const manifest = require("./packages/bindings/generated/defold-api-policy.json");
              console.log(`base        ${index.base.url}${index.base.pathPrefix ? "/" + index.base.pathPrefix : ""}`);
              console.log(`layout      ${index.base.layoutVersion}`);
              console.log(`revisions   ${index.entries.length}`);
              console.log(`generator   ${manifest.generator}`);
              for (const entry of index.entries) console.log(`  ${entry.defoldRevision} -> ${entry.policyRoot}`);
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The push IS the deploy: Pages serves `deherm-policy-site` directly. The
      # emitted tree is a pure function of the committed store, so it replaces
      # the branch content wholesale rather than merging - anything not emitted
      # should not be on the branch. Objects are content-addressed, so this is
      # still additive in practice: an unchanged revision re-emits identical
      # bytes and the commit is empty.
      - name: Publish to the policy site branch
        if: github.repository == 'ts-defold/deherm' && github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: deherm-ci
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: deherm-ci
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          set -euo pipefail
          branch=deherm-policy-site
          # A worktree keeps the emitted tree and the source checkout apart, so
          # nothing in build/ can leak into the published branch.
          git fetch origin "$branch" --depth=1
          git worktree add --detach /tmp/site "origin/$branch"
          # Replace, do not merge: the branch is a function of the store.
          find /tmp/site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R build/policy-site/. /tmp/site/
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then
            echo "Policy site unchanged; publishing nothing."
            exit 0
          fi
          git commit -m "publish: policy site from ${GITHUB_SHA::12}"
          git push origin "HEAD:$branch"

      # Ask for the build rather than assuming the push caused one.
      #
      # A push made with GITHUB_TOKEN does not trigger workflow runs - GitHub
      # suppresses that to stop a workflow re-triggering itself. Pages branch
      # builds appear to arrive by a different route (their runs record the
      # event as `dynamic`, not `push`), so this MIGHT publish on its own, but
      # "might" is not a property worth depending on for the thing that serves
      # the policies. This endpoint requests a build unconditionally, so
      # publication does not hinge on which internal path a token push takes.
      #
      # Requesting a build when one is already queued is not an error, so this
      # is safe if the push did trigger one.
      - name: Request a Pages build
        if: github.repository == 'ts-defold/deherm' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          echo "Requested a Pages build for ${GITHUB_REPOSITORY}."
