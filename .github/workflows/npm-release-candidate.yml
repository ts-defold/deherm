name: npm release candidate proof

# This deliberately does not publish npm or create a Git tag. It proves the
# exact tarball in a clean consumer before either irreversible release action.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap pinned Hermes sources for npm prepack
        run: bash scripts/bootstrap-upstreams.sh hermes
      - name: Verify package metadata and generated-state boundary
        run: |
          pnpm check:release-readiness
          pnpm check:package-revision-boundary
          pnpm check:knowledge
      - name: Prove tarball installation and Defold browser/native bundles
        run: node scripts/prove-npm-consumer.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-consumer-proof
          path: build/npm-consumer-proof.json
          if-no-files-found: ignore
