name: native-artifacts

# Three independent matrices, deliberately kept apart in this file because
# conflating them has already cost review time. They now publish under three
# independent release tags for the same reason - see
# `scripts/lib/artifact-releases.mjs` for the input set behind each.
#
#   * target libraries - one libhermes.a per Defold BUNDLE TARGET, because Bob
#     uploads it to Extender for whatever platform is being bundled. A user on
#     macOS bundling for Android needs the Android archive and none of their own.
#     Tagged `native-artifacts-<short fp>`.
#   * host compilers - hermesc and shermes per USER HOST, because they run on
#     the user's machine. Both are pure compilers, so shipping them imposes no
#     native toolchain requirement on the user. Each pair must be built on a
#     runner of its own architecture: they are LLVM, and a cross build would
#     need a second toolchain per host. Tagged `hermes-host-<short fp>`.
#   * the transform compiler - dehermc, also per USER HOST, but pure Go with
#     CGO_ENABLED=0, so ONE runner cross-compiles the whole matrix. It is the
#     cheapest artifact déherm ships and the one whose absence used to make
#     every user's first build run a `go build` of the typescript-go compiler.
#     Tagged `dehermc-<short fp>`.
#
# The two host families shared one `host-tools-<fp>` tag until the fingerprints
# were split to their true input sets. They share no input: a Go transform edit
# republished ten unchanged LLVM compilers, and a Hermes repin republished five
# unchanged Go binaries.
#
# The target list is derived from the pinned Defold sources into
# packages/toolchains/defold-bundle-targets.json, so a Defold release that adds
# a bundle platform fails `manage-native-artifacts.mjs verify` rather than
# silently leaving that platform unbuilt.
#
# ── Why release assets and not workflow artifacts ────────────────────────────
#
# A workflow artifact expires (90 days by default), is scoped to one run, and
# needs an authenticated API call to fetch. None of that survives to a user six
# months after a déherm release. These are published as GitHub RELEASE ASSETS
# under a tag derived from the SHA-256 fingerprint of the inputs that determine
# that family's artifact - the lock KEYS it consumes, its build recipe, the
# archive packager, and for the target archives the `sdk` and `targets` fields
# of the derived bundle-target list. Keys and fields, never whole files: hashing
# all of `upstream.lock` made hermesc a function of `DEFOLD_REV`, so a nightly
# Defold repin republished all 25 artifacts for zero byte change. The artifacts
# are content-addressed: many déherm versions share one artifact release, and a
# rebuild whose inputs have not changed finds the release already present and
# does nothing.
#
# The tag carries the first 16 hex digits of that fingerprint, not all 64. The
# full digest went into the release list, into every download URL and into the
# policy index entry, at a length no one can compare by eye or quote in a bug
# report; 64 bits is ample to separate a population of releases derived from
# this checkout's own files. The full digest is still recorded - in the release
# notes and beside the tag in the policy index entry - so every provenance claim
# is still made over all 256 bits.
#
# ── What an asset is ────────────────────────────────────────────────────────
#
# One reproducible `.tar.gz` per matrix row. A target's archive holds its
# release library AND a debugger-enabled second compilation; a host's holds that
# family's compilers. A release asset is a single file, so two libraries could
# not be two assets; flat assets also lose the executable bit, which GitHub does
# not store, and encoded structure in a name that the download side then had to
# parse back out with a per-family regular expression.
#
# Vendor a completed run with:
#   node scripts/manage-native-artifacts.mjs pull [--tag <tag>] --partial
#   node scripts/manage-host-compilers.mjs   pull [--family <name>] [--tag <tag>] --partial
#
# Both default to the tags their own fingerprints name, so the usual invocation
# takes no arguments at all; `manage-host-compilers.mjs pull` fetches both host
# families unless `--family` names one.

on:
  workflow_dispatch:
  push:
    paths:
      - upstream.lock
      - toolchains/hermes/**
      - toolchains/go/**
      - packages/compiler/go.mod
      - packages/compiler/ttsc/**
      - packages/toolchains/defold-bundle-targets.json
      - packages/toolchains/host-compilers.json
      - scripts/package-defold-extension.sh
      - .github/workflows/native-artifacts.yml

permissions:
  contents: write

# Serialize. Runs with identical inputs compute the SAME tag, so concurrent runs
# race each other creating that release and clobbering each other's assets -
# which has already cost this repository a release that ended up holding two
# assets of fifteen. Queue rather than cancel: these lanes take tens of minutes
# and a cancelled run can leave a release half-populated, which the plan job's
# completeness check would then have to repair on the next push.
concurrency:
  group: native-artifacts
  cancel-in-progress: false

jobs:
  # One place decides what this run is called and whether it has anything to do.
  # `fingerprint` hashes the inputs that determine each artifact family, so two
  # runs with identical inputs address the same release and the second is a
  # no-op rather than a second copy.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      target_tag: ${{ steps.compute.outputs.target_tag }}
      hermes_host_tag: ${{ steps.compute.outputs.hermes_host_tag }}
      dehermc_tag: ${{ steps.compute.outputs.dehermc_tag }}
      # The FULL digest the tag truncates, and the human release title. Both are
      # derived beside the tag in scripts/lib/artifact-releases.mjs and carried
      # to the upload step, so nothing downstream re-derives either.
      target_fingerprint: ${{ steps.compute.outputs.target_fingerprint }}
      hermes_host_fingerprint: ${{ steps.compute.outputs.hermes_host_fingerprint }}
      dehermc_fingerprint: ${{ steps.compute.outputs.dehermc_fingerprint }}
      target_title: ${{ steps.compute.outputs.target_title }}
      hermes_host_title: ${{ steps.compute.outputs.hermes_host_title }}
      dehermc_title: ${{ steps.compute.outputs.dehermc_title }}
      target_exists: ${{ steps.compute.outputs.target_exists }}
      hermes_host_exists: ${{ steps.compute.outputs.hermes_host_exists }}
      dehermc_exists: ${{ steps.compute.outputs.dehermc_exists }}
      android_ndk_version: ${{ steps.sdk.outputs.android_ndk_version }}
      android_ndk_api: ${{ steps.sdk.outputs.android_ndk_api }}
      android_64_ndk_api: ${{ steps.sdk.outputs.android_64_ndk_api }}
      iphoneos_version_min: ${{ steps.sdk.outputs.iphoneos_version_min }}
      macosx_version_min: ${{ steps.sdk.outputs.macosx_version_min }}
      # Whether the Defold registry credential is configured. Secrets cannot be
      # read in a job-level `if`, so the decision is made once here and the two
      # windows lanes key off it - which also keeps them mutually exclusive
      # rather than both racing the same asset.
      registry_credential: ${{ steps.credential.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      # The fingerprint reads Defold's build_input.yml, so it needs the `yaml`
      # dependency. Nothing else here runs project code.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is asked for, never assembled. It used to be built here by
          # concatenating a prefix onto `fingerprint` output, which put the
          # prefix in two places - this file and artifact-releases.mjs - while
          # the expected-asset listing was derived from only one of them.
          # Truncating the digest into the tag would have turned that into a
          # silent divergence, so the concatenation is gone.
          emit() {
            local prefix="$1"; shift
            local metadata; metadata="$("$@")"
            node -e '
              const [prefix, metadata] = process.argv.slice(1);
              const { tag, fingerprint, title } = JSON.parse(metadata);
              require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,
                `${prefix}_tag=${tag}\n${prefix}_fingerprint=${fingerprint}\n${prefix}_title=${title}\n`);
            ' "$prefix" "$metadata"
            node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$metadata"
          }
          target_tag="$(emit target node scripts/manage-native-artifacts.mjs release-metadata)"
          hermes_host_tag="$(emit hermes_host node scripts/manage-host-compilers.mjs release-metadata hermes-host)"
          dehermc_tag="$(emit dehermc node scripts/manage-host-compilers.mjs release-metadata dehermc)"
          # A COMPLETE release means these exact inputs have already been built,
          # and rebuilding would produce the same bytes at best while churning
          # the digests users pinned at worst.
          #
          # Completeness is decided on the assets, never on the tag. An early
          # run created both releases up front and then failed every build lane,
          # leaving one release empty and the other holding two assets of
          # fifteen - and an existence check treated both as finished forever,
          # reporting success for a workflow that had built nothing. Releases
          # are now created by the first successful upload, so an empty one
          # cannot exist, but the asset check still guards a partial run.
          complete() {
            local tag="$1" expected="$2"
            gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || return 1
            local present
            present="$(gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' | sort)"
            local missing
            missing="$(comm -23 <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$present"))"
            if [ -n "$missing" ]; then
              echo "release $tag is incomplete; missing:" >&2
              printf '  %s\n' $missing >&2
              return 1
            fi
          }

          if complete "$target_tag" "$(node scripts/manage-native-artifacts.mjs expected-assets)"; then
            echo "target_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Per family, not per host: the ten Hermes compilers and the five
          # dehermc binaries live in different releases now, and one being
          # complete says nothing about the other.
          if complete "$hermes_host_tag" "$(node scripts/manage-host-compilers.mjs expected-assets hermes-host)"; then
            echo "hermes_host_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "hermes_host_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if complete "$dehermc_tag" "$(node scripts/manage-host-compilers.mjs expected-assets dehermc)"; then
            echo "dehermc_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "dehermc_exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The SDK levels every cross build has to match are the engine's own,
      # derived from upstream/defold/build_tools/sdk.py. Reading them here keeps
      # the container and Xcode invocations from carrying a second, drifting
      # copy.
      - id: credential
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}
        run: |
          if [ -n "$GCP_ARTIFACT_REGISTRY_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - id: sdk
        run: |
          node -e '
            const sdk = require("./packages/toolchains/defold-bundle-targets.json").sdk;
            const out = [
              ["android_ndk_version", sdk.androidNdkVersion],
              ["android_ndk_api", sdk.androidNdkApiVersion],
              ["android_64_ndk_api", sdk.android64NdkApiVersion],
              ["iphoneos_version_min", sdk.iphoneosVersionMin],
              ["macosx_version_min", sdk.macosxVersionMin]
            ];
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out.map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
          '

  go-compiler:
    needs: plan
    if: needs.plan.outputs.dehermc_exists != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v6
      # The ttsc Go module - and the typescript-go checkout under its shim/ -
      # arrives with the npm package, pinned by pnpm-lock.yaml. It is not
      # vendored into this repository, so there is exactly one statement of the
      # compiler's provenance.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/compiler/go.mod
          cache: false
      # The build script packages the archive itself, so what determines the
      # published bytes is inside an input this family fingerprints. A packaging
      # step written here would not be - the workflow is in no family's input
      # set - and a change to it would publish different bytes under a tag users
      # had already pinned.
      - run: |
          bash toolchains/go/build-dehermc.sh ${{ matrix.host }} \
            build/artifacts/host-compilers/${{ matrix.host }}/bin \
            build/artifacts/dehermc-${{ matrix.host }}.tar.gz
      # A binary that cannot answer for itself is not shippable. `version` is
      # the identity `deherm doctor` reads back.
      - if: matrix.host == 'linux-x64'
        run: build/artifacts/host-compilers/linux-x64/bin/dehermc version
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.dehermc_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.dehermc_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.dehermc_tag }}" "${{ github.repository }}" \
            "build/artifacts/dehermc-${{ matrix.host }}.tar.gz" "dehermc-${{ matrix.host }}.tar.gz"

  # ── Target libraries: one libhermes.a per Defold bundle target ──────────────

  linux:
    needs: plan
    if: needs.plan.outputs.target_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            docker_platform: linux/amd64
            defold_platform: x86_64-linux
          - runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
            defold_platform: arm64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # `upstream/` is not committed - it is bootstrapped reproducibly from
      # upstream.lock. Only the Hermes tree is named, because cloning Defold on
      # every build lane costs more than the build it prepares for.
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - run: docker buildx build --platform ${{ matrix.docker_platform }} --output type=local,dest=build/artifacts/${{ matrix.defold_platform }} -f toolchains/hermes/Dockerfile.linux .
      # The container emits `hermes.tar.gz`, already reproducible, already
      # holding both the release and debugger-enabled libraries. The upload
      # names it for the target; renaming a file does not change its bytes.
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.target_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.target_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.target_tag }}" "${{ github.repository }}" \
            "build/artifacts/${{ matrix.defold_platform }}/hermes.tar.gz" "hermes-${{ matrix.defold_platform }}.tar.gz"

  # ── Windows: Defold's own toolchain when we can reach it ────────────────────
  #
  # Dockerfile.win32 builds inside extender-winsdk, the image Extender itself
  # uses, which is what makes the archive ABI-exact against the toolchain that
  # will link it - including the MSVC STL version and CRT linkage that the JSI
  # surface's standard-library types require both sides to agree on.
  #
  # That registry refuses anonymous pulls but serves any AUTHENTICATED Google
  # identity, so a service account credential is the whole difference. When one
  # is configured this lane runs; when it is not - a fork, or a checkout without
  # the secret - `windows-native` runs instead and produces a weaker artifact
  # rather than no artifact. Exactly one of the two ever runs.
  windows:
    needs: plan
    if: needs.plan.outputs.target_exists != 'true' && needs.plan.outputs.registry_credential == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # `upstream/` is not committed - it is bootstrapped reproducibly from
      # upstream.lock. Only the Hermes tree is named, because cloning Defold on
      # every build lane costs more than the build it prepares for.
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}
      # The credential needs no role on Defold's project: the grant is to
      # authenticated identities, not to named principals. It only has to be a
      # real Google identity that can mint a token.
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - run: docker buildx build --platform linux/amd64 --output type=local,dest=build/artifacts/x86_64-win32 -f toolchains/hermes/Dockerfile.win32 .
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.target_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.target_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.target_tag }}" "${{ github.repository }}" \
            "build/artifacts/x86_64-win32/hermes.tar.gz" "hermes-x86_64-win32.tar.gz"

  # The fallback when no registry credential is configured. build-windows.sh
  # records why this artifact makes a weaker provenance claim than every other
  # lane's.
  windows-native:
    needs: plan
    if: needs.plan.outputs.target_exists != 'true' && needs.plan.outputs.registry_credential != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - run: bash scripts/bootstrap-upstreams.sh hermes
      # KNOWN STALE PIN. Every other action here now runs on Node 24; this one
      # cannot. ilammy/msvc-dev-cmd's newest release, v1.13.0, still declares
      # `using: node20`, the repository is unmaintained, and the request to
      # publish a Node 24 build (ilammy/msvc-dev-cmd#94) is open with no
      # release behind it. So the Node 20 deprecation warning on this lane is
      # real and is not fixed by a version bump - there is no version to bump
      # to. When GitHub finishes removing the Node 20 runtime this step stops
      # resolving and this lane fails outright rather than warning.
      #
      # Replacing it is a behavioural change to how the MSVC environment is
      # entered, so it is left for a deliberate decision rather than folded
      # into a version sweep. The two candidates:
      #   - egor-tensin/vs-shell: composite action, pure PowerShell, no Node
      #     runtime at all, so it cannot deprecate this way again.
      #   - TheMrMilchmann/setup-msvc-dev: maintained JS action, closest
      #     drop-in for the inputs this action accepts.
      # The same pin appears in the host-compilers lane below.
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja --no-progress -y
      - run: |
          bash toolchains/hermes/build-windows.sh \
            "$PWD/upstream/hermes" \
            "$PWD/build/win32" \
            "$PWD/build/artifacts/x86_64-win32/hermes.tar.gz"
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.target_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.target_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.target_tag }}" "${{ github.repository }}" \
            "build/artifacts/x86_64-win32/hermes.tar.gz" "hermes-x86_64-win32.tar.gz"

  android:
    needs: plan
    if: needs.plan.outputs.target_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - defold_platform: armv7-android
            abi: armeabi-v7a
            api_kind: android_ndk_api
          - defold_platform: arm64-android
            abi: arm64-v8a
            api_kind: android_64_ndk_api
          - defold_platform: x86_64-android
            abi: x86_64
            api_kind: android_64_ndk_api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # `upstream/` is not committed - it is bootstrapped reproducibly from
      # upstream.lock. Only the Hermes tree is named, because cloning Defold on
      # every build lane costs more than the build it prepares for.
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg ANDROID_ABI=${{ matrix.abi }} \
            --build-arg ANDROID_API=${{ needs.plan.outputs[matrix.api_kind] }} \
            --build-arg NDK_VERSION=${{ needs.plan.outputs.android_ndk_version }} \
            --output type=local,dest=build/artifacts/${{ matrix.defold_platform }} \
            -f toolchains/hermes/Dockerfile.android .
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.target_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.target_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.target_tag }}" "${{ github.repository }}" \
            "build/artifacts/${{ matrix.defold_platform }}/hermes.tar.gz" "hermes-${{ matrix.defold_platform }}.tar.gz"

  # macOS x64, iOS and the iOS simulator need the Apple SDKs, so there is no
  # container path for them. One macOS runner builds all four Apple targets and
  # reuses a single host-compiler build across them.
  apple:
    needs: plan
    if: needs.plan.outputs.target_exists != 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        defold_platform: [arm64-osx, x86_64-osx, arm64-ios, arm64_sim-ios]
    env:
      DEFOLD_MACOSX_VERSION_MIN: ${{ needs.plan.outputs.macosx_version_min }}
      DEFOLD_IPHONEOS_VERSION_MIN: ${{ needs.plan.outputs.iphoneos_version_min }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # `upstream/` is not committed - it is bootstrapped reproducibly from
      # upstream.lock. Only the Hermes tree is named, because cloning Defold on
      # every build lane costs more than the build it prepares for.
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - run: brew install ninja cmake
      - run: |
          bash toolchains/hermes/build-apple.sh \
            ${{ matrix.defold_platform }} \
            "$PWD/upstream/hermes" \
            "$PWD/build/hermes/${{ matrix.defold_platform }}" \
            "$PWD/build/artifacts/${{ matrix.defold_platform }}/hermes.tar.gz"
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.target_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.target_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.target_tag }}" "${{ github.repository }}" \
            "build/artifacts/${{ matrix.defold_platform }}/hermes.tar.gz" "hermes-${{ matrix.defold_platform }}.tar.gz"

  # ── Host compilers: hermesc and shermes, one pair per user host ─────────────
  #
  # Each pair is built on a runner of that host's own architecture: these are
  # the binaries other builds import, so cross-compiling them would defeat the
  # point.
  host-compilers:
    needs: plan
    if: needs.plan.outputs.hermes_host_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than 24.04 sets the shipped glibc floor at 2.35,
          # so the published compilers run on hosts older than the runner.
          - runner: ubuntu-22.04
            host: linux-x64
          - runner: ubuntu-22.04-arm
            host: linux-arm64
          - runner: macos-15
            host: darwin-arm64
          - runner: macos-15-intel
            host: darwin-x64
          - runner: windows-2022
            host: win32-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # `upstream/` is not committed - it is bootstrapped reproducibly from
      # upstream.lock. Only the Hermes tree is named, because cloning Defold on
      # every build lane costs more than the build it prepares for.
      - run: bash scripts/bootstrap-upstreams.sh hermes
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake lld ninja-build python3
      - if: runner.os == 'macOS'
        run: brew install ninja cmake
      # KNOWN STALE PIN - see the windows-native lane above for why this one
      # action is still on Node 20 and what would replace it.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      # The build script packages hermesc and shermes into one archive itself,
      # so the step that decides the published bytes is inside an input this
      # family fingerprints rather than in this file, which is in none.
      - run: |
          bash toolchains/hermes/build-host-compilers.sh \
            "$PWD/upstream/hermes" \
            "$PWD/build/host-compilers/${{ matrix.host }}" \
            "$PWD/build/artifacts/host-compilers/${{ matrix.host }}/bin" \
            "$PWD/build/artifacts/hermes-host-${{ matrix.host }}.tar.gz"
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.hermes_host_title }}
          RELEASE_FINGERPRINT: ${{ needs.plan.outputs.hermes_host_fingerprint }}
        run: |
          bash scripts/ci/upload-release-asset.sh \
            "${{ needs.plan.outputs.hermes_host_tag }}" "${{ github.repository }}" \
            "build/artifacts/hermes-host-${{ matrix.host }}.tar.gz" "hermes-host-${{ matrix.host }}.tar.gz"

  # A run that published nothing verifiable is a run that taught us nothing.
  # This reports what each release now carries, so the gap between the matrix
  # and the release is visible in the run summary rather than discovered by a
  # user.
  summary:
    needs: [plan, go-compiler, linux, windows, windows-native, android, apple, host-compilers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for tag in "${{ needs.plan.outputs.target_tag }}" \
                     "${{ needs.plan.outputs.hermes_host_tag }}" \
                     "${{ needs.plan.outputs.dehermc_tag }}"; do
            {
              echo "### $tag"
              echo
              echo '```'
              gh release view "$tag" --repo "${{ github.repository }}" --json assets \
                --jq '.assets[] | "\(.name)\t\(.size) bytes"' 2>&1 || echo "no release"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
