name: conformance

# Run every generated route against a real Defold engine, and publish what
# happened.
#
# ── Why this job exists ────────────────────────────────────────────────────
#
# `.agents/docs/decisions/generate-report-never-gate.md` says every documented
# route ships and one we cannot verify ships marked, with a generated test
# behind the mark. That promise is only worth something if the test actually
# runs, and until this workflow the engine run existed as
# `test:headless-conformance:runtime` - in no check chain and no workflow. It
# ran when a person remembered to run it, which is not a verification system.
#
# ── Why it asserts rather than ratchets ────────────────────────────────────
#
# The conformance report carries no timestamp, no path and nothing about the
# host: the same driver against the same engine produces the same bytes. So
# this does not compare counts against a baseline that could drift - it
# regenerates both artifacts from a real engine and requires them to equal what
# is committed. A difference means the committed claim about which routes work
# is no longer true, which is exactly the thing worth failing on.
#
# ── One platform, not fifteen ──────────────────────────────────────────────
#
# This runs on one Linux runner and that is deliberate. Defold maintains this
# engine and publishes its own Lua API; executing every route on every platform
# is their job and they have done it. Our engine run is a bonus signal that
# upgrades specific routes from "Defold says this works" to "we watched it
# work", and it is not the bar for shipping a route unmarked.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # After the nightly policy derivation, so a repinned revision is measured
    # against the engine on the same day it is derived.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      # bob is a Java program. `check-headless-conformance.mjs` reads JAVA_HOME
      # and only falls back to a Homebrew path, so setting it here is what makes
      # the job independent of how the runner happens to be provisioned.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang lld

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Every input is pinned and digest-verified by the script that fetches it.
      # `extender` carries the Defold SDK the driver links against, `ref-doc`
      # the reference archive the surface is derived from, and `defold` the
      # engine sources the reviewed evidence cites.
      - run: bash scripts/bootstrap-upstreams.sh defold extender ref-doc
      - run: bash scripts/bootstrap-bob.sh
      # libhermes.a, by deterministic release URL rather than by checking a
      # 10 MB binary into the repository.
      - run: pnpm artifacts:pull

      - run: pnpm configure:native

      # Builds the driver, bundles the generated harness with bob, and runs the
      # whole contract set inside a real headless engine one tick at a time.
      - name: Exercise every route against a real engine
        run: node scripts/check-headless-conformance.mjs

      - name: Derive the per-route verification status
        run: node scripts/generate-route-verification.mjs

      # The report, whatever happened above.
      - name: Report
        if: always()
        run: |
          {
            echo "## Route verification"
            echo
            echo '```'
            node scripts/generate-route-verification.mjs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-verification
          path: |
            packages/bindings/generated/defold-route-verification.json
            packages/bindings/generated/defold-headless-conformance-report.json
          if-no-files-found: ignore

      # The assertion. Both artifacts are deterministic functions of the engine
      # and the generated harness, so a difference means what is committed no
      # longer describes what the engine does.
      - name: The committed verification must match the engine
        run: |
          if ! git diff --exit-code -- \
            packages/bindings/generated/defold-headless-conformance-report.json \
            packages/bindings/generated/defold-route-verification.json; then
            echo "::error::A real engine produced different results from the committed verification artifacts. Regenerate them: node scripts/check-headless-conformance.mjs && node scripts/generate-route-verification.mjs" >&2
            exit 1
          fi
