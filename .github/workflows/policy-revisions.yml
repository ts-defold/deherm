name: policy-revisions

# Watch Defold's release channels and derive a policy for any revision the index
# does not already cover.
#
# See `.agents/docs/decisions/layered-api-policy-cache.md` ("The nightly job"),
# `.agents/docs/decisions/revision-parametric-derivation.md`, and
# `.agents/docs/decisions/api-source-resolution.md` ("A channel is a moving
# pointer, never a pin").
#
# ── The property that makes this cheap ──────────────────────────────────────
#
# Because objects are content-addressed, a revision whose declaration inputs did
# not change publishes NOTHING: the subtree hashes already exist and the index
# simply gains one more pointer at them. The steady-state cost of a Defold
# release is one index line. `plan` exits without a matrix when every tracked
# channel already resolves to an indexed revision, and even when a revision IS
# new, `generate-api-policy.mjs` reports how many objects were actually added -
# often zero.
#
# ── The derivation never touches the checkout ──────────────────────────────
#
# `scripts/derive-revision.mjs` materialises this checkout into a scratch
# workspace, repins and regenerates THERE, and fingerprints the committed
# surface before and after to prove it did not move. That is what makes deriving
# a revision other than the pinned one possible at all: the whole generated
# surface is written to fixed repository paths for exactly one revision, so
# regenerating in place would overwrite the surface `pnpm check` verifies.
#
# It is also why this job no longer runs the generators itself. The chain, its
# order, the engine slice it needs and the paths it may write are declared in
# that script, where a test can check them against the ownership registries;
# inline in a workflow, nothing could run them and nothing could check them.
#
# ── Why this opens a pull request instead of pushing ────────────────────────
#
# Adopting a derivation changes what this repository treats as ground truth:
# `upstream.lock` is repinned to that revision with the digests the immutable
# archive actually served. That is a reviewed decision, not an automated one,
# and a policy is reviewable on purpose - a diff showing a parameter change from
# required to optional is meant to be a visible event. The branch carries the
# repinned lock, the regenerated surface, the new policy objects and the index
# entry together, so the review sees the whole derivation.
#
# ── What a moved Defold source does here, and what it does not ─────────────
#
# A reviewed input under `packages/bindings/overrides/` records the SHA-256 and
# the exact text anchors of every Defold source its review rests on. A changed
# SHA-256 does not stop this job and never has any business doing so: Defold
# editing its own C++ between two releases is what this job exists to derive
# FOR. A changed hash means a new policy entry for that revision - so we know
# how to emit code for it, and so an entry can be added, removed or swapped per
# version - and the census of what changed is attached to the run summary as a
# report.
#
# The one observation that changes what gets emitted is a reviewed ANCHOR that
# is gone, because then the evidence for emitting is gone: that entry is
# withdrawn for this revision and the routes it covered degrade to unreviewed.
# That shows up as a visible difference in the pull request's diff, which is the
# reviewable event, and as queued review work named in the summary. It is still
# not a failure and still does not block a release.
#
# See `scripts/lib/revision-audit.mjs` for the three classifications.

on:
  schedule:
    # Daily. Defold publishes to `stable`, `beta` and `alpha` independently, and
    # a channel can move at any time; nothing downstream keys on the channel, so
    # polling frequency only changes how quickly a new sha gets an index entry.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: Derive this Defold revision instead of reading the channels
        required: false
      carry-reviews:
        description: >-
          Carry reviewed inputs whose revision differs onto the derived revision.
          Every carry is recorded and reported; the anchors each reviewed input
          names are still checked against the derived revision, so this cannot
          make a stale review pass - a review whose anchors are gone has its
          entry withdrawn for that revision either way. Defaults ON, because a
          scheduled derivation of a NEW revision necessarily meets reviewed
          inputs naming the old one. Untick it to see where a derivation would
          stop without any carry.
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: policy-revisions
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      derive: ${{ steps.plan.outputs.derive }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: plan
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.revision }}" ]; then
            derive='[{"channel":"manual","sha1":"${{ inputs.revision }}","version":null}]'
          else
            # Fails closed: an unreachable channel or a malformed info.json is an
            # error, never an empty plan. "Nothing to do" and "could not find
            # out" must not look the same.
            derive="$(node scripts/track-defold-channels.mjs plan --json | node -e 'process.stdin.once("data", (d) => process.stdout.write(JSON.stringify(JSON.parse(d).derive)))')"
          fi
          echo "derive=$derive" >> "$GITHUB_OUTPUT"
          if [ "$derive" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Every tracked channel already resolves to an indexed revision; nothing to derive or publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/track-defold-channels.mjs plan >> "$GITHUB_STEP_SUMMARY"
        if: always()

  derive:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    # Linux, like every other job here. The dmSDK parse is target-directed and
    # resolves against a digest-pinned sysroot, so the inventory - and therefore
    # the policy root - is a function of the Defold revision and the declared
    # targets rather than of the runner. See
    # `.agents/docs/decisions/target-directed-dmsdk-parse.md`; the equality is
    # measured by the `host-parity` job in `derivation.yml`, not assumed here.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        revision: ${{ fromJSON(needs.plan.outputs.derive) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The pinned C library headers the dmSDK parse resolves against. The
      # importer fetches them on demand and verifies the digest either way; the
      # cache only saves the download, and its key is the digest, so a repin
      # misses rather than serving the wrong bytes.
      - id: sysroot
        run: |
          set -euo pipefail
          sed -n 's/^DMSDK_PARSE_SYSROOT_SHA256=//p' upstream.lock \
            | awk '{ print "digest=" $0 }' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: upstream/dmsdk-parse-sysroot
          key: dmsdk-parse-sysroot-${{ steps.sysroot.outputs.digest }}

      # One step. It materialises a workspace, repins `upstream.lock` there to
      # the observed revision with the digests the immutable archive served,
      # fetches the engine slice, audits every reviewed input against that
      # revision's sources, runs the whole derivation chain, proves this
      # checkout's committed surface did not move, and only then adopts the
      # derived surface into the working tree for the pull request.
      #
      # `--adopt` refuses a blocked derivation, so a run that could not derive
      # cannot open a pull request carrying a half-regenerated surface.
      - name: Derive ${{ matrix.revision.sha1 }}
        id: derive
        continue-on-error: true
        env:
          # Where every generator in the chain appends what it observed about
          # the reviewed policies it read. Nothing in here fails a run - see
          # `scripts/lib/revision-audit.mjs` - it is the audit of what Defold
          # changed, rendered into this run's summary by the step below.
          DEHERM_REVISION_AUDIT: ${{ runner.temp }}/revision-audit.ndjson
        run: |
          set -euo pipefail
          node scripts/derive-revision.mjs \
            --revision "${{ matrix.revision.sha1 }}" \
            --workspace "$RUNNER_TEMP/derivation" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.carry-reviews == false) && '' || '--carry-reviews' }} \
            --adopt 2>&1 | tee "$RUNNER_TEMP/derivation.txt"

      - name: Report
        if: always()
        env:
          DEHERM_REVISION_AUDIT: ${{ runner.temp }}/revision-audit.ndjson
        run: |
          {
            echo "### ${{ matrix.revision.channel }} ${{ matrix.revision.version }} (${{ matrix.revision.sha1 }})"
            echo
            echo '```'
            cat "$RUNNER_TEMP/derivation.txt" || echo "the derivation produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The audit of what moved in Defold between the reviewed revision and
          # this one. It is a report, not a gate: a moved source is a new policy
          # entry for this revision, and only a lost anchor changes what we
          # emit. Rendered whether or not the derivation succeeded, because when
          # one DOES fail this is most of what says why.
          node scripts/report-revision-audit.mjs \
            --revision "${{ matrix.revision.sha1 }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reviewed-policy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-audit-${{ matrix.revision.sha1 }}
          path: ${{ runner.temp }}/revision-audit.ndjson
          if-no-files-found: ignore

      # Publication artefacts, derived from the adopted surface. These are the
      # consumer-facing checks: the site must build and a client must be able to
      # resolve a revision through it end to end, including the tampered-object
      # control.
      - name: Check the published shape
        if: steps.derive.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/build-policy-site.mjs --out build/policy-site
          node scripts/check-policy-site-resolution.mjs

      # A pull request, never a push: repinning upstream.lock and moving a
      # derived surface are reviewed decisions. Deploying happens from main, by
      # the policy-site workflow, after that review.
      - uses: peter-evans/create-pull-request@v8
        if: steps.derive.outcome == 'success'
        with:
          branch: policy/defold-${{ matrix.revision.sha1 }}
          base: main
          title: "policy: derive Defold ${{ matrix.revision.version || matrix.revision.sha1 }}"
          commit-message: |
            policy: derive Defold ${{ matrix.revision.sha1 }}

            Observed on the ${{ matrix.revision.channel }} channel. upstream.lock is
            repinned with the digests the immutable archive served. Content-addressed
            subtrees that did not move are unchanged, so this diff shows exactly what
            the engine's declared surface changed.
          body: |
            Derived from the `${{ matrix.revision.channel }}` channel, which resolved to
            `${{ matrix.revision.sha1 }}` (${{ matrix.revision.version }}).

            Review notes:

            * Subtree hashes that did not change are not in this diff; the policy root and
              the index entry always are.
            * The derivation ran in a scratch workspace and proved this checkout's
              committed surface did not move before adopting anything. The run summary
              carries the reviewed-evidence census and any carried reviews.
            * `upstream.lock` digests were computed from what `d.defold.com/archive`
              served during this run.
          # Every path the derivation's own ownership registries declare it may
          # write. The previous list named four of them, so a merged pull request
          # could carry a regenerated script IR with none of the generated C++,
          # TypeScript or harness fixtures derived from it.
          add-paths: |
            upstream.lock
            packages/bindings/generated
            packages/sdk/src/generated
            packages/static-hermes/src/generated
            defold/defold_hermes/include/defold_hermes
            defold/defold_hermes/src
            defold/defold_hermes/lib/web
            examples/runtime-smoke/src/generated
            tests/fixtures
            .agents/docs/research

      - name: Fail the job when the revision could not be derived
        if: steps.derive.outcome != 'success'
        run: |
          echo "Defold ${{ matrix.revision.sha1 }} could not be derived; see the run summary." >&2
          exit 1
