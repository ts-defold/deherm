name: policy

# One workflow owns the complete policy lifecycle. A scheduled run discovers
# every unindexed Defold channel revision, derives all of them on Linux into one
# accumulated content-addressed store, validates that store on the other hosts,
# exercises its generated routes in a real engine, and publishes the usable
# result. Review state and conformance state are evidence: they are reported,
# never a gate that hides the rest of Defold's mechanically generated API.

on:
  schedule:
    # 08:00 EDT (fixed UTC-4); 07:00 EST in winter. Hosted runs may queue.
    - cron: "0 12 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Derive this Defold revision instead of reading stable, beta and alpha
        required: false
      revision_channel:
        description: Extender channel to use for an explicit revision that is not currently tracked
        type: choice
        options: [stable, beta, alpha]
        required: false
      artifact_refresh_only:
        description: Re-publish the current policy with a newly complete artifact mapping
        type: boolean
        default: false
      artifact_policy_revision:
        description: Exact indexed Defold revision whose native mapping was refreshed
        required: false
      artifact_compatibility_sha256:
        description: Native compatibility identity whose immutable assets were refreshed
        required: false
      artifact_source_sha:
        description: Builder source commit that produced the immutable native assets
        required: false
      carry-reviews:
        description: Carry applicable reviewed lowering hints and report every carry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Source validations and artifact refreshes share one writer queue. Retain
  # every pending run so callbacks cannot replace a push's source validation.
  group: policy-v2-${{ github.ref }}
  queue: max

jobs:
  plan:
    name: Discover revisions
    runs-on: ubuntu-24.04
    outputs:
      derive: ${{ steps.plan.outputs.derive }}
      any: ${{ steps.plan.outputs.any }}
      tracked_revisions: ${{ steps.plan.outputs.tracked_revisions }}
      authoritative: ${{ steps.plan.outputs.authoritative }}
      consumer_revisions: ${{ steps.plan.outputs.consumer_revisions }}
      end_to_end_candidates: ${{ steps.plan.outputs.end_to_end_candidates }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ts-defold/deherm
          ref: deherm-policy-site
          path: build/published-policy-site
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fail fast on package-owned release inputs
        run: pnpm check:release-preflight
      - id: plan
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_CHANNEL: ${{ inputs.revision_channel }}
          CALLBACK_REVISION: ${{ inputs.artifact_policy_revision }}
          CALLBACK_COMPATIBILITY: ${{ inputs.artifact_compatibility_sha256 }}
          REFRESH_ONLY: ${{ inputs.artifact_refresh_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          canary=()
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.event_name }}" = pull_request ]; then
            canary=(--include-alpha-canary)
          fi
          channel_plan="$RUNNER_TEMP/channel-plan.json"
          node scripts/track-defold-channels.mjs plan --json \
            --index build/published-policy-site/v1/index/manifest.json "${canary[@]}" > "$channel_plan"
          refresh_only=false
          if [ "$REFRESH_ONLY" = true ]; then refresh_only=true; fi
          compatibility_index_args=()
          if [ "$refresh_only" = true ] && [ -n "$CALLBACK_REVISION" ] && [ -n "$CALLBACK_COMPATIBILITY" ]; then
            node scripts/hydrate-policy-site.mjs --from build/published-policy-site
            node scripts/policy-native-artifact-inputs.mjs --all \
              --out "$RUNNER_TEMP/callback-compatibility-index.json"
            compatibility_index_args=(
              --callback-compatibility "$CALLBACK_COMPATIBILITY"
              --compatibility-index "$RUNNER_TEMP/callback-compatibility-index.json"
            )
          fi
          run_plan="$(node scripts/plan-policy-workflow.mjs \
            --event "$EVENT_NAME" \
            --requested-revision "$REQUESTED_REVISION" \
            --requested-channel "$REQUESTED_CHANNEL" \
            --refresh-only "$refresh_only" \
            --callback-revision "$CALLBACK_REVISION" \
            "${compatibility_index_args[@]}" \
            --channel-plan "$channel_plan")"
          derive="$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).derive))' "$run_plan")"
          tracked_revisions="$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).trackedRevisions))' "$run_plan")"
          authoritative="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).authoritative))' "$run_plan")"
          consumer_revisions="$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).consumerRevisions))' "$run_plan")"
          end_to_end_candidates="$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).endToEndCandidates))' "$run_plan")"
          echo "derive=$derive" >> "$GITHUB_OUTPUT"
          echo "tracked_revisions=$tracked_revisions" >> "$GITHUB_OUTPUT"
          echo "authoritative=$authoritative" >> "$GITHUB_OUTPUT"
          echo "consumer_revisions=$consumer_revisions" >> "$GITHUB_OUTPUT"
          echo "end_to_end_candidates=$end_to_end_candidates" >> "$GITHUB_OUTPUT"
          if [ "$derive" = '[]' ]; then
            echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Policy plan'
            echo
            echo "Event: \`${{ github.event_name }}\`"
            echo
            echo "Revisions to derive: \`$derive\`"
          } >> "$GITHUB_STEP_SUMMARY"

  derive:
    name: Generate complete policy store
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    outputs:
      generated: ${{ steps.derive.outputs.generated }}
      failed: ${{ steps.derive.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ts-defold/deherm
          ref: deherm-policy-site
          path: build/published-policy-site
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install and preflight policy native toolchain
        run: bash scripts/ci/install-policy-native-toolchain.sh --install

      - name: Hydrate the accumulated published store
        run: node scripts/hydrate-policy-site.mjs --from build/published-policy-site

      - id: sysroot
        run: sed -n 's/^DMSDK_PARSE_SYSROOT_SHA256=/digest=/p' upstream.lock >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: upstream/dmsdk-parse-sysroot
          key: dmsdk-parse-sysroot-${{ steps.sysroot.outputs.digest }}

      - id: derive
        name: Derive every new revision without review gates
        env:
          DERIVATIONS: ${{ needs.plan.outputs.derive }}
          TRACKED_REVISIONS: ${{ needs.plan.outputs.tracked_revisions }}
          SCOPE_FILE: ${{ runner.temp }}/policy-reports/reconciliation-scope.json
          EXAMINED_TSV: ${{ runner.temp }}/policy-reports/examined.tsv
          CARRY_REVIEWS: ${{ (github.event_name != 'workflow_dispatch' || inputs.carry-reviews) && 'true' || 'false' }}
          MIRROR_BOB: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy-reports"
          : > "$EXAMINED_TSV"
          node -e '
            for (const row of JSON.parse(process.env.DERIVATIONS)) {
              process.stdout.write([row.channel, row.sha1, row.version ?? "unknown", row.canary === true ? "true" : "false"].join("\t") + "\n");
            }
          ' > "$RUNNER_TEMP/policy-revisions.tsv"
          generated=0
          failed=0
          while IFS=$'\t' read -r channel revision version canary; do
            [ -n "$revision" ] || continue
            workspace="$RUNNER_TEMP/derive-$revision"
            audit="$RUNNER_TEMP/policy-reports/$revision.audit.ndjson"
            log="$RUNNER_TEMP/policy-reports/$revision.log"
            args=(--revision "$revision" --workspace "$workspace" --verify-current --adopt)
            if [ "$CARRY_REVIEWS" = true ]; then args+=(--carry-reviews); fi
            set +e
            DEHERM_REVISION_AUDIT="$audit" node scripts/derive-revision.mjs "${args[@]}" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            {
              echo "### $channel ${version:-unknown} ($revision)"
              echo
              echo '```text'
              cat "$log"
              echo '```'
              node scripts/report-revision-audit.mjs --revision "$revision" || true
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\t%s\t%s\n' "$channel" "$revision" "$version" >> "$EXAMINED_TSV"
            if [ "$status" -eq 0 ]; then
              if [ "$MIRROR_BOB" = true ]; then
                node scripts/publish-defold-bob-mirror.mjs --workspace "$workspace" --revision "$revision"
              fi
              if [ "$canary" != true ]; then generated=$((generated + 1)); fi
            else
              failed=$((failed + 1))
              printf '%s\t%s\t%s\n' "$channel" "$revision" "$version" >> "$RUNNER_TEMP/policy-reports/failures.tsv"
            fi
          done < "$RUNNER_TEMP/policy-revisions.tsv"

          node -e '
            const tracked = JSON.parse(process.env.TRACKED_REVISIONS);
            const examined = require("node:fs").readFileSync(process.env.EXAMINED_TSV, "utf8").trim().split("\n").filter(Boolean)
              .map((line) => { const [channel, revision, version] = line.split("\t"); return {channel, revision, version: version || "unknown"}; });
            require("node:fs").writeFileSync(process.env.SCOPE_FILE, JSON.stringify({
              trackedRevisions: tracked === null ? null : tracked.map(({channel, sha1, version}) => ({channel, revision: sha1, version: version ?? "unknown"})),
              examinedRevisions: examined,
            }, null, 2) + "\n");
          '

          # Even with no new revision, verify the committed store. When a
          # revision was not derivable, this still emits every already usable
          # policy instead of suppressing the entire site.
          bash scripts/bootstrap-upstreams.sh defold
          node scripts/generate-api-policy.mjs --prune
          node scripts/generate-api-policy.mjs --check
          node scripts/build-policy-site.mjs --out build/policy-site --validation-only
          node scripts/check-policy-site-resolution.mjs
          node scripts/check-policy-site-parity.mjs --root build/policy-site --write "$RUNNER_TEMP/policy-site-parity.json"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Reconcile actionable policy derivation issues
        if: >-
          (needs.plan.outputs.authoritative == 'true' || needs.plan.outputs.any == 'true') &&
          github.repository == 'ts-defold/deherm' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/reconcile-policy-derivation-issues.mjs \
            --failures "$RUNNER_TEMP/policy-reports/failures.tsv" \
            --reports "$RUNNER_TEMP/policy-reports" \
            --scope "$RUNNER_TEMP/policy-reports/reconciliation-scope.json" \
            --run-url "$RUN_URL"
      - name: Reconcile optimization issues after authoritative channel planning
        if: >-
          needs.plan.outputs.authoritative == 'true' &&
          github.repository == 'ts-defold/deherm' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/reconcile-policy-optimization-issues.mjs \
            --failures "$RUNNER_TEMP/policy-reports/failures.tsv" \
            --reports "$RUNNER_TEMP/policy-reports" \
            --run-url "$RUN_URL"

      - name: Pack the exact generated surface
        run: |
          node scripts/policy-surface.mjs pack --archive "$RUNNER_TEMP/policy-surface.tar.gz"
          node scripts/policy-surface-identity.mjs create \
            --archive "$RUNNER_TEMP/policy-surface.tar.gz" \
            --identity "$RUNNER_TEMP/policy-surface-identity.json" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: policy-surface
          path: |
            ${{ runner.temp }}/policy-surface.tar.gz
            ${{ runner.temp }}/policy-surface-identity.json
            ${{ runner.temp }}/policy-site-parity.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: policy-derivation-reports
          path: ${{ runner.temp }}/policy-reports
          if-no-files-found: ignore

  request-native-artifacts:
    name: Request compatible native optimization artifacts
    needs: [publish-site]
    if: >-
      needs.publish-site.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.artifact_refresh_only) &&
      github.repository == 'ts-defold/deherm' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: native-artifact-worklist
          path: ${{ runner.temp }}/native-artifact-worklist
      - name: Queue each missing compatibility recipe from the published store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          worklist="$RUNNER_TEMP/native-artifact-worklist/native-work.json"
          while IFS=$'\t' read -r revision compatibility; do
            [ -n "$revision" ] || continue
            gh workflow run native-artifacts.yml --repo "${{ github.repository }}" \
              --ref "${{ github.ref_name }}" \
              -f policy_defold_revision="$revision" \
              -f policy_compatibility_sha256="$compatibility" \
              -f policy_source_sha="${{ github.sha }}"
          done < <(node -e '
            for (const row of require(process.argv[1])) {
              process.stdout.write(`${row.defoldRevision}\t${row.compatibilitySha256}\n`);
            }
          ' "$worklist")

  derivation-completeness:
    name: Every discovered revision derived
    needs: [plan, derive]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report missing revision policies without hiding usable ones
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DERIVE_RESULT: ${{ needs.derive.result }}
          DERIVATION_FAILURES: ${{ needs.derive.outputs.failed }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != success ] || [ "$DERIVE_RESULT" != success ]; then
            echo "Policy planning or derivation infrastructure failed: plan=$PLAN_RESULT derive=$DERIVE_RESULT" >&2
            exit 1
          fi
          if [ "$DERIVATION_FAILURES" != 0 ]; then
            echo "$DERIVATION_FAILURES discovered Defold revision(s) could not be derived; see per-revision logs and issues." >&2
            exit 1
          fi
          echo 'Every discovered Defold revision has a policy.'

  host-parity:
    name: ${{ matrix.role }}
    needs: derive
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            role: Linux canonical bytes
          - os: macos-15-intel
            role: macOS reproduces Linux
          - os: windows-2025
            role: Windows reproduces Linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: policy-surface
          path: ${{ runner.temp }}/policy-surface
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify policy cache lifecycle on this host
        run: pnpm test:policy-cache
      - name: Verify package-owned materializer against its pinned fixture
        run: pnpm test:policy-surface-materializer
      - name: Install the generated surface
        run: |
          archive="$RUNNER_TEMP/policy-surface/policy-surface.tar.gz"
          node scripts/policy-surface.mjs install --archive "$archive"
      # Linux already parsed the selected Defold source. Rebuilding the site
      # from that immutable policy tests the cross-host consumer projection;
      # re-downloading an unrelated pinned ref-doc is neither required nor
      # evidence about the selected revision.
      - run: node scripts/build-policy-site.mjs --out build/policy-site --validation-only
      - run: node scripts/check-policy-site-resolution.mjs
      - run: >-
          node scripts/check-policy-site-parity.mjs --root build/policy-site
          --expected "$RUNNER_TEMP/policy-surface/policy-site-parity.json"

  engine-conformance:
    name: Compile, link and run in Defold
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: actions/download-artifact@v7
        with:
          name: policy-surface
          path: ${{ runner.temp }}/policy-surface
      - run: node scripts/policy-surface.mjs install --archive "$RUNNER_TEMP/policy-surface/policy-surface.tar.gz"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - name: Install and preflight policy native toolchain
        run: bash scripts/ci/install-policy-native-toolchain.sh --install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: defold-sdk
        run: sed -n 's/^DEFOLD_SDK_SHA256=/digest=/p' upstream.lock >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: upstream/defoldsdk.zip
          key: defold-sdk-${{ steps.defold-sdk.outputs.digest }}
      - run: bash scripts/bootstrap-upstreams.sh defold hermes extender ref-doc defold-sdk
      - name: Generate headless plan for selected policy surface
        run: pnpm generate:headless-conformance
      - name: Wait for the content-addressed Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(node scripts/manage-native-artifacts.mjs tag x86_64-linux)"
          asset=hermes-x86_64-linux.tar.gz
          deadline=$((SECONDS + 2700))
          while ! gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for $asset in $tag" >&2
              exit 1
            fi
            echo "::notice::Waiting for native-artifacts to publish $asset in $tag"
            sleep 30
          done
      - name: Pull the Linux Hermes target archive
        run: node scripts/manage-native-artifacts.mjs pull --target x86_64-linux
      - name: Compile and run generated dmSDK and extension exact-call twins
        env:
          DEHERM_REQUIRE_PACKAGED_HERMES: "1"
        run: pnpm check:exact-call-materializers
      - name: Verify the selected SDK headless link projection
        run: pnpm test:headless-conformance
      - name: Configure the native exact-call targets
        run: pnpm configure:native
      - name: Compile and run generated Lua/script exact-call twins
        run: |
          node scripts/build-script-api-e2e.mjs
          cmake --build build/native --target \
            defold-hermes-script-recording-engine \
            defold-hermes-script-recording-lua-adapter \
            defold-hermes-script-constant-lua-adapter-test \
            defold-hermes-script-recording-native-pod \
            defold-hermes-lua-bridge-test \
            defold-hermes-lua-hermes-e2e \
            defold-hermes-script-api-hermes-e2e \
            defold-hermes-static-special-call-test \
            --parallel
          build/native/defold-hermes-script-recording-engine \
            tests/fixtures/generated_script_recording_driver.js \
            tests/fixtures/generated_script_recording_expected_trace.txt \
            build/script-recording-engine-trace.txt
          build/native/defold-hermes-script-recording-lua-adapter
          build/native/defold-hermes-script-constant-lua-adapter-test
          build/native/defold-hermes-script-recording-native-pod \
            tests/fixtures/generated_script_recording_native_pod_driver.js
          build/native/defold-hermes-lua-bridge-test
          build/native/defold-hermes-lua-hermes-e2e
          build/native/defold-hermes-script-api-hermes-e2e build/script-api-e2e.js
          build/native/defold-hermes-static-special-call-test
          node --test tests/web-library.test.mjs
      - name: Compile and run the bounded Static Hermes exact-call unit
        run: |
          cmake --build build/native --target \
            defold-hermes-static-script-exact-test \
            defold-hermes-static-dmsdk-exact-test \
            --parallel
          build/native/defold-hermes-static-script-exact-test
          build/native/defold-hermes-static-dmsdk-exact-test
      - name: Compile and run Hermes debugger breakpoint transport
        run: pnpm test:runtime-inspector
      - id: emsdk
        run: |
          sed -n 's/^EMSDK_VERSION=/version=/p' upstream.lock >> "$GITHUB_OUTPUT"
          sed -n 's/^EMSDK_REV=/revision=/p' upstream.lock >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            upstream/extender/platformsdk/emsdk-${{ steps.emsdk.outputs.version }}
            upstream/extender/platformsdk/emcache_${{ steps.emsdk.outputs.version }}
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}-${{ steps.emsdk.outputs.revision }}
      - name: Bootstrap the pinned Emscripten SDK
        run: bash scripts/bootstrap-emsdk.sh
      - name: Compile and run dmSDK exact calls in real browser Wasm
        run: pnpm test:dmsdk-browser-exact-call
      - name: Compile and run every emitted script exact call in real browser Wasm
        run: pnpm test:script-browser-exact-call
      - name: Exercise unseen callback registrations in real browser Wasm
        run: DEHERM_TEST_CALLBACK_FALLBACK_BROWSER=1 node --test tests/script-callback-fallback.test.mjs
      - id: engine
        name: Materialize the runtime and exercise every generated route
        continue-on-error: true
        run: |
          bash scripts/bootstrap-bob.sh
          node scripts/check-headless-conformance.mjs
      - name: Derive and report per-route verification
        if: always()
        run: |
          node scripts/generate-route-verification.mjs || true
          {
            echo '## Real-engine route verification'
            echo
            echo "Engine step: \`${{ steps.engine.outcome }}\`"
            echo
            echo '```text'
            node scripts/generate-route-verification.mjs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: policy-engine-evidence
          path: |
            packages/bindings/generated/defold-route-verification.json
            packages/bindings/generated/defold-headless-conformance-report.json
            .agents/docs/data/headless-conformance.log
          if-no-files-found: ignore
      - name: Open or update source contradiction issues
        if: >-
          always() &&
          github.repository == 'ts-defold/deherm' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report=packages/bindings/generated/defold-route-verification.json
          [ -f "$report" ] || exit 0
          # Never materialize issues from a committed/stale report when this
          # run could not derive the current evidence artifact.
          node scripts/generate-route-verification.mjs --check || exit 0
          existing="$RUNNER_TEMP/route-verification-issues.json"
          wanted="$RUNNER_TEMP/route-verification-wanted.json"
          gh issue list --state all --limit 1000 --search 'in:title "route verification:"' \
            --json number,title,state,body,url > "$existing"
          jq '[.wantsIssue[].issue.title]' "$report" > "$wanted"
          jq -c '.wantsIssue[]' "$report" | while IFS= read -r row; do
            title="$(jq -r '.issue.title' <<< "$row")"
            body="$(jq -r '.issue.body' <<< "$row")"
            number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' "$existing" | head -n1)"
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body "$body"
              continue
            fi
            state="$(jq -r --argjson number "$number" '.[] | select(.number == $number) | .state' "$existing")"
            current="$(jq -r --argjson number "$number" '.[] | select(.number == $number) | .body' "$existing")"
            if [ "$state" = CLOSED ]; then gh issue reopen "$number"; fi
            if [ "$current" != "$body" ]; then gh issue edit "$number" --body "$body"; fi
          done
          # The report is authoritative for this revision. Do not leave a stale
          # warning open after its route becomes supported/executed or is
          # removed by Defold.
          jq -c '.[] | select(.state == "OPEN")' "$existing" | while IFS= read -r row; do
            number="$(jq -r '.number' <<< "$row")"
            title="$(jq -r '.title' <<< "$row")"
            if jq -e --arg title "$title" 'index($title) != null' "$wanted" >/dev/null; then continue; fi
            gh issue comment "$number" --body "Automated route verification no longer finds a source/runtime contradiction for this route."
            gh issue close "$number" --reason completed
          done
      - name: Enforce engine-lane infrastructure health
        if: always() && steps.engine.outcome != 'success'
        run: |
          echo 'The real-engine lane failed before it could produce trustworthy execution evidence.' >&2
          exit 1

  publish-site:
    name: Publish policy website
    needs: [derive, host-parity]
    if: >-
      needs.derive.result == 'success' &&
      needs.host-parity.result == 'success' &&
      github.repository == 'ts-defold/deherm' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ts-defold/deherm
          ref: deherm-policy-site
          path: build/published-policy-site
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: policy-surface
          path: ${{ runner.temp }}/policy-surface
      - run: node scripts/policy-surface.mjs install --archive "$RUNNER_TEMP/policy-surface/policy-surface.tar.gz"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover valid native mappings for older Defold revisions
        run: >-
          node scripts/collect-policy-artifact-history.mjs
          --site build/published-policy-site
          --out "$RUNNER_TEMP/artifact-history.json"
      - name: Reconcile all indexed native compatibility mappings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/policy-native-artifact-inputs.mjs --all --out "$RUNNER_TEMP/native-inputs.json"
          node scripts/reconcile-policy-native-artifacts.mjs \
            --inputs "$RUNNER_TEMP/native-inputs.json" \
            --history "$RUNNER_TEMP/artifact-history.json" \
            --complete-directory "$RUNNER_TEMP/complete-artifact-mappings" \
            --history-out "$RUNNER_TEMP/artifact-history.json" \
            --work-out "$RUNNER_TEMP/native-work.json" \
            --health-out "$RUNNER_TEMP/native-health.json"
      - uses: actions/upload-artifact@v6
        with:
          name: native-artifact-worklist
          path: ${{ runner.temp }}/native-work.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: native-artifact-health
          path: ${{ runner.temp }}/native-health.json
          if-no-files-found: error
      - run: bash scripts/bootstrap-upstreams.sh defold
      - run: node scripts/generate-api-policy.mjs --check
      - id: artifact-map
        name: Select an authenticated artifact mapping for the policy store
        run: |
          set -euo pipefail
          fallback="$RUNNER_TEMP/reconciled-artifact-references.json"
          selected_compatibility="$RUNNER_TEMP/reconciled-artifact-compatibility.txt"
          node -e '
            const fs = require("node:fs");
            const history = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(history)) throw new Error("Reconciled artifact history must be an array");
            const selected = history[0];
            if (!selected) {
              throw new Error("No authenticated complete native-artifact mapping is available; refusing to fabricate release coordinates");
            }
            const compatibility = selected["native-artifacts"]?.compatibility?.sha256;
            if (!/^[a-f0-9]{64}$/.test(compatibility ?? "")) {
              throw new Error("Selected artifact history has no authenticated native compatibility digest");
            }
            fs.writeFileSync(process.argv[2], `${JSON.stringify(selected, null, 2)}\n`);
            fs.writeFileSync(process.argv[3], `${compatibility}\n`);
          ' "$RUNNER_TEMP/artifact-history.json" "$fallback" "$selected_compatibility"
          selected_compatibility="$(cat "$selected_compatibility")"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "Selected authenticated compatibility $selected_compatibility; each indexed revision resolves its exact compatible mapping from reconciled history." >> "$GITHUB_STEP_SUMMARY"
      - name: Build the policy site
        env:
          FALLBACK_ARTIFACTS: ${{ steps.artifact-map.outputs.fallback }}
        run: |
          set -euo pipefail
          args=(--out build/policy-site)
          args+=(--artifact-history "$RUNNER_TEMP/artifact-history.json")
          args+=(--artifact-references "$FALLBACK_ARTIFACTS")
          node scripts/build-policy-site.mjs "${args[@]}"
          node scripts/build-docs-site.mjs --out build/policy-site/docs
      - uses: actions/upload-artifact@v6
        with:
          name: expected-policy-index
          path: build/policy-site/v1/index
          if-no-files-found: error
      - run: node scripts/check-policy-site-resolution.mjs
      - name: Publish accumulated policies to deherm-policy-site
        env:
          GIT_AUTHOR_NAME: deherm-ci
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: deherm-ci
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          set -euo pipefail
          branch=deherm-policy-site
          git fetch origin "$branch" --depth=1
          git worktree add --detach /tmp/site "origin/$branch"
          find /tmp/site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R build/policy-site/. /tmp/site/
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then
            echo 'Policy site is already current.'
          else
            git commit -m "publish: policy site from ${GITHUB_SHA::12}"
            git push origin "HEAD:$branch"
          fi
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent

  native-artifact-reconciliation-health:
    name: Native artifact inventory and integrity health
    needs: [publish-site]
    if: needs.publish-site.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: native-artifact-health
          path: ${{ runner.temp }}/native-artifact-health
      - name: Report inventory or immutable-sidecar failures after policy publication
        run: node scripts/check-policy-native-artifact-health.mjs "$RUNNER_TEMP/native-artifact-health/native-health.json"

  consumer-smoke:
    name: Resolve published policy and generate a clean project
    needs: [plan, derive, publish-site]
    if: needs.publish-site.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: expected-policy-index
          path: ${{ runner.temp }}/expected-policy-index
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Wait for Pages and resolve the public content-addressed store
        env:
          PLANNED_REVISIONS: ${{ needs.plan.outputs.consumer_revisions }}
        run: node scripts/check-published-policy.mjs --expected-index "$RUNNER_TEMP/expected-policy-index"
      - name: Provision pinned Hermes inputs for npm packaging
        if: needs.plan.outputs.consumer_revisions != '[]'
        run: bash scripts/bootstrap-upstreams.sh hermes
      - name: Pack once and generate every distinct planned revision as an npm consumer
        if: needs.plan.outputs.consumer_revisions != '[]'
        env:
          CONSUMER_REVISIONS: ${{ needs.plan.outputs.consumer_revisions }}
        run: |
          set -euo pipefail
          mapfile -t hashes < <(node -e '
            const seen = new Set();
            for (const row of JSON.parse(process.env.CONSUMER_REVISIONS)) {
              if (!seen.has(row.sha1)) { seen.add(row.sha1); process.stdout.write(`${row.sha1}\n`); }
            }
          ')
          revision_args=()
          for sha in "${hashes[@]}"; do revision_args+=(--defold-sdk "$sha"); done
          node scripts/prove-npm-consumer.mjs --pack-only "${revision_args[@]}"
          candidate="$(node -p 'require("./build/npm-consumer-proof.json").tarball')"
          node scripts/prove-npm-consumer.mjs --candidate "$candidate" --generate-only "${revision_args[@]}"
      - name: Check exact-revision native readiness for bounded Bob candidates
        if: needs.plan.outputs.end_to_end_candidates != '[]'
        env:
          E2E_CANDIDATES: ${{ needs.plan.outputs.end_to_end_candidates }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/ready-end-to-end.json"
          : > "$RUNNER_TEMP/ready-end-to-end.tsv"
          declare -A checked=()
          while IFS=$'\t' read -r channel sha; do
            [ -n "$sha" ] || continue
            if [ -z "${checked[$sha]+present}" ]; then
              status="$RUNNER_TEMP/readiness-$sha"
              node scripts/check-published-native-artifacts.mjs --defold-sdk "$sha" --github-output "$status"
              checked[$sha]="$(sed -n 's/^ready=//p' "$status" | tail -n1)"
            fi
            if [ "${checked[$sha]}" = true ]; then printf '%s\t%s\n' "$channel" "$sha" >> "$RUNNER_TEMP/ready-end-to-end.tsv"; fi
          done < <(node -e '
            for (const row of JSON.parse(process.env.E2E_CANDIDATES)) {
              process.stdout.write(`${row.channel}\t${row.sha1}\n`);
            }
          ')
          node -e '
            const rows = require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n").filter(Boolean)
              .map((line) => { const [channel, sha1] = line.split("\t"); return {channel, sha1}; });
            require("node:fs").writeFileSync(process.argv[2], JSON.stringify(rows, null, 2) + "\n");
          ' "$RUNNER_TEMP/ready-end-to-end.tsv" "$ready"
      - uses: actions/upload-artifact@v6
        if: needs.plan.outputs.end_to_end_candidates != '[]'
        with:
          name: ready-end-to-end-revisions
          path: ${{ runner.temp }}/ready-end-to-end.json
          if-no-files-found: error

  dispatch-end-to-end:
    name: Run full end-to-end after public policy resolution
    needs: [plan, consumer-smoke]
    if: >-
      needs.consumer-smoke.result == 'success' &&
      needs.plan.outputs.end_to_end_candidates != '[]' &&
      github.repository == 'ts-defold/deherm' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ready-end-to-end-revisions
          path: ${{ runner.temp }}/ready-end-to-end-revisions
      - name: Dispatch each ready exact revision to its observed channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e '
            for (const row of require(process.argv[1])) {
              process.stdout.write(`${row.sha1}\t${row.channel}\n`);
            }
          ' "$RUNNER_TEMP/ready-end-to-end-revisions/ready-end-to-end.json" | \
          while IFS=$'\t' read -r sha channel; do
            [ -n "$sha" ] || continue
            case "$channel" in stable|beta|alpha) ;; *)
              echo "::notice::Native mapping is ready for $sha, but no observed or explicitly selected Extender channel is available for automatic Bob dispatch."
              continue
              ;;
            esac
            gh workflow run end-to-end.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              -f defold-sdk="$sha" -f defold-channel="$channel"
          done
